aid: axtria
name: Axtria
description: 'Axtria is an AI-first cloud software and data analytics company built
  for the life sciences industry, founded in 2010 and headquartered in Berkeley Heights,
  New Jersey. Its cloud product suite — Axtria DataMAx (AI-driven data management),
  Axtria InsightsMAx.ai (agentic AI and cloud analytics), Axtria SalesIQ (sales planning
  and operations), Axtria MarketingIQ (marketing analytics and omnichannel measurement)
  and Axtria CustomerIQ (omnichannel customer engagement) — helps pharmaceutical,
  biotech, medical device, animal health and consumer health commercial teams turn
  data into targeting, segmentation, incentive compensation, field force and brand
  decisions. Axtria reports 3,600+ employees serving 100+ life sciences companies,
  including 16+ of the top 20 pharmaceutical enterprises. Axtria publishes no public
  developer portal and no open API documentation: the product documentation host
  docs.axtria.com is HTTP Basic-auth gated to customers, and platform integration
  (Veeva CRM, Salesforce, Marketo and 20+ structured and unstructured life sciences
  data sources over SFTP and APIs) is delivered under enterprise contract rather
  than through a self-service developer surface.'
